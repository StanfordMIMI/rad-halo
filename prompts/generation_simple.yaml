# Impression generation prompt, simple instruction (App. A.4-A.6). The three few-shot examples are
# MIMIC-IV-Note reports (derived/few_shot_note_ids.csv), filled in by radhalo.generation.prompts.
system: |
  You are an expert medical professional.
user: |-
  Summarize the radiology report findings into an impression with minimal text.
  Output only a bare numbered list with short sentences.
  Use the examples to guide word choice.


  [[ EXAMPLE 1 ]]
  [REPORT]
  {example_1_report}

  [IMPRESSION]
  {example_1_impression}


  [[ EXAMPLE 2 ]]
  [REPORT]
  {example_2_report}

  [IMPRESSION]
  {example_2_impression}
  

  [[ EXAMPLE 3 ]]
  [REPORT]
  {example_3_report}

  [IMPRESSION]
  {example_3_impression}


  [[ CURRENT SAMPLE ]]
  [REPORT]
  {full_report_text}

  [IMPRESSION]
